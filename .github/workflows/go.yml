name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ubuntu-latest
    env:
      USER: ${{ secrets.USER }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DBNAME: ${{ secrets.DBNAME }}
      HOST: ${{ secrets.HOST }}
      PORT: ${{ secrets.PORT }}
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Test
      run: go test -v main_test.go
      
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v -o main.exe main.go
  
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: go-artifact
        path: main.exe

  docker:
    needs: build #Esse job (docker) rodara após a execução do job "build"
    uses: ./.github/workflows/Docker.yml #O job "docker" rodara com base no conteundo de "Docker.yml"
    secrets: inherit #Permite que o job "docker" utilize os segredos definidos nesse workflow (go.yml)

  deploy_ec2:
    needs: docker #Esse job (deploy_ec2) rodara após a execução do job "docker"
    uses: ./.github/workflows/Deploy_EC2.yml #O job "deploy_ec2" rodara com base no conteundo de "Deploy_EC2.yml"
    secrets: inherit #Permite que o job "deploy_ec2" utilize os segredos definidos nesse workflow (go.yml)